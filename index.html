<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#030614" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Solar Odyssey — explore, scan, mine and trade your way across a 3D solar system, right in your browser." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffb347'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='4.5' fill='none' stroke='%236ec6ff' stroke-width='1.6' transform='rotate(-18 16 16)'/%3E%3C/svg%3E" />
  <title>Solar Odyssey</title>
  <style>
    /* Minimal pre-WebGL wrapper so a failed/unloaded module is never a blank
       white page. The game's own stylesheet replaces this as soon as it loads. */
    html, body { margin: 0; height: 100%; background: #030614; color: #cfe3ff; font-family: system-ui, sans-serif; }
    #boot-error { position: fixed; inset: 0; z-index: 999; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; background: #030614; }
    #boot-error[hidden] { display: none !important; }
    #boot-error div { max-width: 480px; }
    #boot-error h1 { font-size: 18px; letter-spacing: .2em; color: #ff5c7a; margin: 0 0 12px; }
    #boot-error p { font-size: 13px; color: #7d93b8; line-height: 1.6; margin: 0 0 14px; }
  </style>
  <script>
    (function () {
      function showError(msg) {
        if (window.__SOLAR_BOOT_ERROR_SHOWN) return;
        window.__SOLAR_BOOT_ERROR_SHOWN = true;
        var box = document.getElementById('boot-error');
        if (!box) return;
        box.hidden = false;
        var p = box.querySelector('p');
        if (msg && p) p.textContent = msg;
        box.querySelector('button').onclick = function () { location.reload(); };
      }
      window.__solarBootError = showError;
      window.addEventListener('error', function (e) {
        if (window.__SOLAR_BOOTED) return;
        showError((e && (e.message || e.error && e.error.message)) || 'The game failed to start. Refresh the page to try again.');
      });
      // Capture resource-load failures too (missing JS/CSS asset, blocked module).
      document.addEventListener('error', function (e) {
        if (window.__SOLAR_BOOTED) return;
        var t = e && e.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
          showError('A required game file could not be loaded. Refresh the page or check your connection.');
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (window.__SOLAR_BOOTED) return;
        showError((e && e.reason && (e.reason.message || String(e.reason))) || 'The game failed to start. Refresh the page to try again.');
      });
    })();
  </script>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="app"></div>
  <div id="boot-error" hidden>
    <div>
      <h1>SOLAR ODYSSEY DID NOT START</h1>
      <p>Loading the game failed or your browser blocked WebGL. Please refresh the page and make sure hardware acceleration is enabled.</p>
      <button class="btn" onclick="location.reload()">RELOAD</button>
    </div>
  </div>
  <noscript>
    <div style="position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:#030614;color:#cfe3ff;text-align:center;padding:24px;">
      JavaScript is disabled. Enable JavaScript to play Solar Odyssey.
    </div>
  </noscript>
  <script type="module" src="./src/main.js" onerror="window.__solarBootError && window.__solarBootError('The main game script could not be loaded. Refresh to try again.')"></script>
</body>
</html>
